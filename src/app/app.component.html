<div class="min-h-dvh w-full bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 flex flex-col">
  <header class="bg-white dark:bg-gray-900 w-full px-4 h-14 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between">
    <a routerLink="/app" class="focus-ring rounded-md flex items-center gap-2 font-extrabold text-3xl tracking-tight lowercase" aria-label="Readster: ir para a biblioteca">
      <img src="logo.svg" alt="" width="34" height="31" />
      Readster
    </a>
    <button type="button" class="btn btn-ghost btn-icon"
      [attr.aria-label]="'Tema: ' + themeInfo.label + '. Clique para alternar.'"
      [title]="'Tema: ' + themeInfo.label"
      (click)="cycleTheme()">
      <lucide-icon [name]="themeInfo.icon" aria-hidden="true" />
    </button>
  </header>
  <main class="flex flex-col flex-1 items-center px-3 py-4 sm:px-4 sm:py-6 gap-4">
    <router-outlet />
  </main>
</div>
